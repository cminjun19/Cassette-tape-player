<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Walkman</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            font-family: Arial, sans-serif;
        }

        .walkman {
            width: 360px;
            padding: 20px;
            background: #d6d6d6;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 18px;
            color: #222;
        }

        .cassette-slot {
            width: 100%;
            height: 190px;
            padding: 15px;
            background: #222;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cassette {
            position: relative;
            width: 260px;
            height: 150px;
            background: #111;
            border-radius: 8px;
            border: 3px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
        }

        .reel {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #777;
            border: 8px solid #333;
            position: relative;
        }

        .reel::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background: #222;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .tape-label {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 105px;
            padding: 8px 4px;
            background: white;
            color: #111;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            border-radius: 3px;
            overflow: hidden;
            white-space: nowrap;
        }

        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .eject {
            background: #8b2020;
        }

        .eject:hover {
            background: #b52a2a;
        }

        .status {
            margin-top: 18px;
            padding: 12px;
            background: #111;
            color: #00ff66;
            border-radius: 8px;
            text-align: center;
            font-family: monospace;
        }

        .track {
            margin-top: 8px;
            color: #ddd;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="walkman">

        <div class="title">
            Virtual Walkman
        </div>

        <div class="cassette-slot">

            <div class="cassette" id="cassette">

                <div class="reel" id="reelLeft"></div>

                <div class="tape-label" id="tapeLabel">
                    NO TAPE
                </div>

                <div class="reel" id="reelRight"></div>

            </div>

        </div>

        <div class="controls">

            <button onclick="loadTape('tape01.html')">
                TAPE 01
            </button>

            <button onclick="loadTape('tape02.html')">
                TAPE 02
            </button>

            <button onclick="loadTape('tape03.html')">
                TAPE 03
            </button>

            <button class="eject" onclick="ejectTape()">
                EJECT
            </button>

        </div>

        <div class="status">

            <div id="statusText">
                No cassette inserted
            </div>

            <div class="track" id="trackText">
                -
            </div>

        </div>

        <audio id="audioPlayer"></audio>

    </div>

    <script src="script.js"></script>

</body>
</html>
